name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 364807861749.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push Docker image
        run: |
          docker build -t portfolio .
          docker tag portfolio:latest 364807861749.dkr.ecr.ap-south-1.amazonaws.com/portfolio:latest
          docker push 364807861749.dkr.ecr.ap-south-1.amazonaws.com/portfolio:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 364807861749.dkr.ecr.ap-south-1.amazonaws.com
            docker stop portfolio || true
            docker rm portfolio || true
            docker pull 364807861749.dkr.ecr.ap-south-1.amazonaws.com/portfolio:latest
            docker run -d -p 8000:8000 --name portfolio 364807861749.dkr.ecr.ap-south-1.amazonaws.com/portfolio:latest